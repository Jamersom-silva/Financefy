services:
  - type: web
    name: financefy-backend
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn core.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: financefy-db
          property: connectionString

databases:
  - name: financefy-db
